[project]
name = "catparser"
version = "0.1.0"
description = "🐱 A purr-fectly fast and furr-iously efficient document parser with whisker-sharp analysis! 🐾"
authors = [
    {name = "Mukhammed Garifulla", email = "your.email@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["parser", "cats", "kittens", "document-analysis", "arxiv", "meow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "rich>=13.7.0",
    "typer>=0.9.0",
    "matplotlib>=3.8.0",
    "pyfiglet>=1.0.2",
    "emoji>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
catparser = "catparser.cli:app"
meow-parser = "catparser.cli:app"
purr-parse = "catparser.cli:app"

[project.urls]
Homepage = "https://github.com/generalMG/DocumentParser"
Repository = "https://github.com/generalMG/DocumentParser"
"Bug Tracker" = "https://github.com/generalMG/DocumentParser/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catparser"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
