[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "catparser"
version = "0.1.0"
description = "A blazingly fast, cat-themed document parser written in Rust with Python bindings 🐱"
authors = [
    {name = "CatParser Team"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["parser", "json", "arxiv", "rust", "performance", "cat"]
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/Boulaouaney/DocumentParser"
Repository = "https://github.com/Boulaouaney/DocumentParser"

[project.scripts]
catparser = "catparser.__main__:main"

[tool.maturin]
module-name = "catparser.catparser_rust"
bindings = "pyo3"
features = ["pyo3/extension-module"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
